# Windowed Local-KV MoE QK^T
#
# Routing: only routed query rows (M) are computed per expert.
# Windowed KV: K spans local window W=128 (NOT full sequence).
# Scores (Z) stay in SRAM (flash-style bypass).
#
# Problem: M=128 (routed queries), N=128 (window), K=64
# This is a FIXED-SIZE GEMM that does not grow with sequence length.
# Factor check: M = 8×16 = 128  |  N = 8×16 = 128  |  K = 64

mapping:
  - target: DRAM
    type: temporal
    factors: M2 N2 K1
    permutation: MNK

  - target: DRAM
    type: datatype
    keep:   [B]
    bypass: [A, Z]

  - target: GlobalBuffer
    type: spatial
    factors: M8 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: temporal
    factors: M1 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: spatial
    factors: M1 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]
    bypass: [A, B]
