# Flash QK^T: Z (scores) stays in GlobalBuffer, never hits DRAM.
# SRAM: A[64,64] + B[64,64] + Z[64,64] = 24 KB < 256 KB ✓
# Factor check: M = 8×64×1 = 512 ✓  N = 8×64×1 = 512 ✓  K = 1×1×64 = 64 ✓

mapping:
  # ── DRAM level ──────────────────────────────────────────────────────────
  - target: DRAM
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: DRAM
    type: datatype
    keep:   [A, B]
    bypass: [Z]            # scores never written to DRAM

  - target: GlobalBuffer
    type: temporal
    factors: M64 N64 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]
    bypass: [A, B]
