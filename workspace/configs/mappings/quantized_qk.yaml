# Quantized (INT8) QK^T: flash-style, scores never hit DRAM.
# Uses the same 8-cluster × 8-PE spatial hierarchy as fpga_like.yaml.
# Factor check: M = 8×8×8 = 512  N = 8×8×8 = 512  K = 64

mapping:
  # ── DRAM level ──────────────────────────────────────────────────────────
  - target: DRAM
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: DRAM
    type: datatype
    keep:   [A, B]         # Q and K read from DRAM
    bypass: [Z]            # ← KEY: scores NEVER written to DRAM

  # ── GlobalBuffer level ──────────────────────────────────────────────────
  - target: GlobalBuffer
    type: spatial
    factors: M8 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: temporal
    factors: M1 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]      # Q tile + K tile + score tile all in 32KB SRAM
    bypass: []

  # ── ClusterBuffer level ─────────────────────────────────────────────────
  - target: ClusterBuffer
    type: spatial
    factors: M1 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  # ── RegisterFile level ──────────────────────────────────────────────────
  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]            # one INT8 accumulator per output element
    bypass: [A, B]
