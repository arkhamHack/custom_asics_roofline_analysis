# Flash AV: scores (A) come from SRAM (computed inline, never written to DRAM).
# Spatial: 8 clusters (M) × 8 PEs (N) = 64 MACs active simultaneously.
# Factor check: M = 8×8×8×1×1 = 512 ✓  N = 8×1×8×8×1 = 512 ✓  K = 64 ✓

mapping:
  - target: DRAM
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: DRAM
    type: datatype
    keep:   [B, Z]         # V from DRAM, output to DRAM
    bypass: [A]            # ← KEY: scores came from SRAM, not DRAM

  - target: GlobalBuffer
    type: spatial
    factors: M8 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: temporal
    factors: M1 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: spatial
    factors: M1 N8 K1
    permutation: MNK

  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]
    bypass: [A, B]
