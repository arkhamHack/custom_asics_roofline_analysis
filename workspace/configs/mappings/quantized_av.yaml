# Quantized (INT8) AV: scores (A) inline from SRAM, only V and output touch DRAM.
# Uses the same 8-cluster × 8-PE spatial hierarchy as fpga_like.yaml.
# Factor check: M = 8×8×8 = 512  N = 8×8×8 = 512  K = 64

mapping:
  - target: DRAM
    type: temporal
    factors: M8 N8 K1
    permutation: NMK

  - target: DRAM
    type: datatype
    keep:   [B, Z]
    bypass: [A]

  - target: GlobalBuffer
    type: spatial
    factors: M8 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: temporal
    factors: M1 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: spatial
    factors: M1 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]
    bypass: [A, B]
