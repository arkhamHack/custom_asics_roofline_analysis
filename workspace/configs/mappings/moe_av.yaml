# Windowed Local-KV MoE AV
#
# Sparse output rows (M routed queries); V spans local window (N=W=128).
# Scores (A) from SRAM — not re-read from DRAM.
# Fixed GEMM shape: [128, 128] × [128, 64] → does NOT grow with seq_len.
#
# Factor check: M = 8×16 = 128  |  N = 8×16 = 128  |  K = 64

mapping:
  - target: DRAM
    type: temporal
    factors: M2 N2 K1
    permutation: MNK

  - target: DRAM
    type: datatype
    keep:   [B, Z]
    bypass: [A]

  - target: GlobalBuffer
    type: spatial
    factors: M8 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: temporal
    factors: M1 N1 K1
    permutation: MNK

  - target: GlobalBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: temporal
    factors: M8 N8 K1
    permutation: MNK

  - target: ClusterBuffer
    type: datatype
    keep:   [A, B, Z]
    bypass: []

  - target: ClusterBuffer
    type: spatial
    factors: M1 N8 K1
    permutation: MNK

  - target: RegisterFile
    type: temporal
    factors: M1 N1 K64
    permutation: KMN

  - target: RegisterFile
    type: datatype
    keep:   [Z]
    bypass: [A, B]
