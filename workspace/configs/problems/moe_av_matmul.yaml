# Windowed Local-KV MoE AV — sparse queries, windowed local values
#
#   M = routed_queries  (sparse output rows)
#   N = window_size     (128 — local V, NOT full sequence)
#   K = head_dim
#
# Per-expert GEMM: [M_e, W] × [W, D] → [M_e, D]
# Total complexity: O(N_seq * top_k * W * D) = O(N_seq) since W is constant.

problem:
  shape:
    name: "GEMM"
    dimensions: [M, N, K]
    data_spaces:
      - name: A
        projection:
          - [[M]]
          - [[N]]
      - name: B
        projection:
          - [[N]]
          - [[K]]
      - name: Z
        projection:
          - [[M]]
          - [[K]]
        read_write: True
  M: 128
  N: 128
  K: 64
