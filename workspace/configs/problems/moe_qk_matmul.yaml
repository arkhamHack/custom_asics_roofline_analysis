# Global-KV MoE QK^T — sparse queries, full-sequence keys
#
# One expert: routed queries attend over ALL key positions.
#   M = routed_queries  (default 128 = 512 seq × top-2 / 8 experts)
#   N = seq_len         (global K — all tokens)
#   K = head_dim
#
# Auto-regenerated at other (M, N, K) via hardware.py when seq_len changes.

problem:
  shape:
    name: "GEMM"
    dimensions: [M, N, K]
    data_spaces:
      - name: A
        projection:
          - [[M]]
          - [[K]]
      - name: B
        projection:
          - [[N]]
          - [[K]]
      - name: Z
        projection:
          - [[M]]
          - [[N]]
        read_write: True
  M: 128
  N: 512
  K: 64
