architecture:
    version: '0.4'
    local:
      - name: fpga_system.DRAM
        class: DRAM
        attributes:
            type: LPDDR4
            workd_bits: 8
            block_size: 16
            bandwidth: 25.6
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
      - name: fpga_system.GlobalBuffer
        class: SRAM
        attributes:
            technology: "45nm"
            width: 64
            depth: 32768
            datawidth: 8
            word_bits: 8
            block_size: 8
            n_rdwr_ports: 2
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
      - name: fpga_system.RegisterFile
        class: regfile
        attributes:
            technology: "45nm"
            depth: 16
            width: 16
            datawidth: 8
            word_bits: 8
            n_rdwr_ports: 2
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
      - name: fpga_system.MAC
        class: intmac
        attributes:
            technology: "45nm"
            datawidth: 8
            word_bits: 8
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
