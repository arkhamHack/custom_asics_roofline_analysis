[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-flash-accel"
version = "0.1.0"
description = "Transformer attention on FPGA-style architecture — benchmarks, HLO analysis, Timeloop integration"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.25",
    "jaxlib>=0.4.25",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "rich>=13.5",
]

[project.scripts]
flash-accel = "examples.run_experiment:main"

[tool.setuptools.packages.find]
include = ["python*", "examples*"]
